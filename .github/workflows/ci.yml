# CI for ai-portfolio-builder (cv). PUBLIC repository: every job runs on GitHub-hosted runners (R116), so
# outside code never reaches MADFAM's self-hosted pool.
#
# Supply chain: every action is pinned to a full commit SHA (tag in the comment), every downloaded tool to a
# version and a checksum, top-level permissions are read-only, no job passes `secrets: inherit`.
# No masks: no `|| true`, no `|| echo`; every step fails the job when its command fails.
# Read-proof, fail-closed: every gate prints what it scanned and fails on an empty read.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-docs:
    name: Agent docs and required files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required files and markers
        run: |
          set -euo pipefail
          files="AGENTS.md CLAUDE.md llms.txt llms-full.txt README.md SECURITY.md ECOSYSTEM.md LICENSE NOTICE docs/DEPLOYMENT.md docs/PRODUCT.md docs/REPO_BOUNDARY.md enclii.yaml janua.client.yaml"
          n=0
          for f in $files; do test -f "$f" || { echo "missing $f"; exit 1; }; n=$((n+1)); done
          grep -q '<!-- MADFAM-AGENTS-CANONICAL v1 -->' AGENTS.md
          head -c 2000 AGENTS.md | grep -Eq '^>[[:space:]]*Last Updated:[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*$'
          grep -q 'docs/REPO_BOUNDARY.md' AGENTS.md
          grep -qi 'canonical agent instructions' CLAUDE.md
          grep -q 'AGENTS.md' CLAUDE.md
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          echo "agent-docs: files=$n markers=6 OK"

  web:
    name: web (frozen install, lint, typecheck, test, build, standalone smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from corepack (the version pinned in package.json packageManager)
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint (eslint, zero warnings)
        run: pnpm lint
      - name: Typecheck (tsc --noEmit, strict)
        run: pnpm typecheck
      - name: Unit tests (node:test)
        run: pnpm test
      - name: Next.js production build (standalone output)
        run: pnpm build
      - name: Standalone server smoke (status and headers per Host)
        run: pnpm test:server

  pg:
    name: Postgres suite (owner-scoped data on a real Postgres 16, as the cv_app role)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # postgres:16-alpine pinned by digest (resolved 2026-10-22). Throwaway, trust auth, no secret.
        image: postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
        env:
          POSTGRES_USER: cv_owner
          POSTGRES_DB: cv_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv_owner -d cv_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # The owner runs the migrations (like the PreSync Job); every repository and API test runs as cv_app.
      CV_TEST_OWNER_URL: postgres://cv_owner@127.0.0.1:5432/cv_test
      CV_TEST_APP_URL: postgres://cv_app@127.0.0.1:5432/cv_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from corepack
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: The runtime role, as Enclii onboarding creates it (LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT, limit 8)
        run: |
          set -euo pipefail
          psql "$CV_TEST_OWNER_URL" -v ON_ERROR_STOP=1 \
            -c "create role cv_app login nosuperuser nobypassrls noinherit connection limit 8" \
            -c "grant connect on database cv_test to cv_app"
      - name: Postgres tests (fail closed; read-proof)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pg-tests.log"
          status=0
          pnpm test:pg > "$out" 2>&1 || status=$?
          cat "$out"
          if [ "$status" != 0 ]; then echo "pg: FAIL exit=$status"; exit "$status"; fi
          pass=$(grep -E ' pass [0-9]+$' "$out" | awk '{print $NF}')
          fail=$(grep -E ' fail [0-9]+$' "$out" | awk '{print $NF}')
          if [ -z "$pass" ] || [ "$pass" -lt 29 ] || [ "$fail" != 0 ]; then echo "pg: tests pass=${pass:-none} fail=${fail:-none} FAIL (expected >= 29 passing)"; exit 1; fi
          echo "pg: tests pass=$pass fail=$fail OK"

  e2e:
    name: e2e (Playwright, Chromium, on the built standalone server with a real Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Same throwaway service as the pg job (pinned by digest, trust auth, no secret).
        image: postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
        env:
          POSTGRES_USER: cv_owner
          POSTGRES_DB: cv_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv_owner -d cv_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CV_TEST_OWNER_URL: postgres://cv_owner@127.0.0.1:5432/cv_test
      CV_TEST_APP_URL: postgres://cv_app@127.0.0.1:5432/cv_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from corepack
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: The runtime role, as Enclii onboarding creates it
        run: |
          set -euo pipefail
          psql "$CV_TEST_OWNER_URL" -v ON_ERROR_STOP=1 \
            -c "create role cv_app login nosuperuser nobypassrls noinherit connection limit 8" \
            -c "grant connect on database cv_test to cv_app"
      - name: Next.js production build (standalone output)
        run: pnpm build
      - name: Chromium for Playwright (the version @playwright/test pins)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: e2e specs (fail closed; read-proof)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2e.log"
          status=0
          pnpm test:e2e > "$out" 2>&1 || status=$?
          cat "$out"
          if [ "$status" != 0 ]; then echo "e2e: FAIL exit=$status"; exit "$status"; fi
          passed=$(grep -Eo '^ *[0-9]+ passed' "$out" | grep -Eo '[0-9]+' | tail -1)
          if grep -Eq '^ *[0-9]+ (failed|flaky|skipped)' "$out" || [ -z "$passed" ] || [ "$passed" -lt 68 ]; then echo "e2e: passed=${passed:-none} FAIL (expected >= 68 passing, none failed, flaky or skipped)"; exit 1; fi
          echo "e2e: passed=$passed OK"

  guards:
    name: Guards (file size, forbidden domain)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File-size gate (warn over 600 lines, fail over 800)
        run: python3 scripts/qa/check_file_size.py
      - name: The .com domain that is not MADFAM's appears nowhere (madfam.io is canonical)
        run: |
          set -euo pipefail
          files=$(git ls-files | wc -l)
          if [ "$files" -lt 20 ]; then echo "domain-guard: files=$files FAIL (nothing to scan)"; exit 1; fi
          # The pattern is written with a character class so this file does not match itself.
          if git grep -n -I -i -E 'madfam[.]com' -- .; then echo "domain-guard: files=$files FAIL"; exit 1; fi
          echo "domain-guard: files=$files findings=0 OK"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file. The step checks the
      # tarball against this pin AND against the checksums file it downloads.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # The legacy tree ends at this commit (tag legacy-2025-09). Its 480-commit history was scanned in full by
      # the 2026-10-22 audit (no real secret; placeholders only) and is frozen; this job scans every commit
      # after it, plus the checked-out tree.
      LEGACY_BASE: 7959f35656e91c0b2400a1735e1aea343809f4a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          work="$RUNNER_TEMP/gitleaks" && mkdir -p "$work" && cd "$work"
          curl -fsSL -o "$tgz" "$base/$tgz"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          echo "${GITLEAKS_SHA256}  $tgz" | sha256sum -c -
          grep -F "  $tgz" checksums.txt | sha256sum -c -
          tar -xzf "$tgz" gitleaks
          mkdir -p "$HOME/.local/bin" && install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan every commit after the legacy base (values redacted)
        run: |
          set -euo pipefail
          n=$(git rev-list --count "${LEGACY_BASE}..HEAD")
          if [ "$n" -lt 1 ]; then echo "gitleaks: commits=0 FAIL (nothing to scan)"; exit 1; fi
          echo "gitleaks: scanning commits=$n after ${LEGACY_BASE}"
          gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="${LEGACY_BASE}..HEAD" .
      - name: Scan the checked-out tree (values redacted)
        run: gitleaks dir --config .gitleaks.toml --redact --no-banner .

  pliego-pin:
    # W5-P: cv vendors a pinned slice of Pliego's paper data (apps/web/src/lib/pliego/vendor/, CERN-OHL-W-2.0). This
    # job fetches Pliego at the LOCK's commit (and the commons commit Pliego pins) from the public repositories, then
    # compares every vendored byte and re-runs the print-folds cartridge with Pliego's own kernel (stdlib only).
    name: Pliego paper data matches its pinned source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pliego at the LOCK's commit, the commons at the commit it pins (public, read only)
        run: |
          set -euo pipefail
          commit=$(python3 -c "import json; print(json.load(open('apps/web/src/lib/pliego/vendor/LOCK.json'))['pliego']['commit'])")
          dir="$RUNNER_TEMP/pliego"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/madfam-org/pliego "$commit"
          git -C "$dir" checkout -q FETCH_HEAD
          git -C "$dir" submodule update -q --init --depth 1 projects
          echo "PLIEGO_DIR=$dir" >> "$GITHUB_ENV"
      - name: Byte check and cartridge re-run (read-proof)
        run: python3 scripts/pliego/sync_pliego_data.py --pliego "$PLIEGO_DIR"
