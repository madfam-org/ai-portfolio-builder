# Dependency updates: weekly, grouped, Monday morning in Mexico City. Security updates are not grouped away:
# GitHub opens them as soon as an advisory lands. Ecosystems: npm (the pnpm workspace's one root lockfile),
# the Dockerfile base image digest, and the pinned actions.
version: 2
# Dependabot's update jobs reach only hosts on its egress allowlist; a host named only in `.npmrc` gets a 403 from
# Dependabot's own proxy («egress not allowlisted npm.madfam.io») before any request leaves GitHub. Declaring the
# registry here allowlists it. @pliego/* is world-readable there (root `.npmrc`), so no credential: no token, no secret.
# No `scope` (the committed `.npmrc` already maps @pliego) and no `replaces-base` (every other package stays on npmjs).
registries:
  npm-madfam:
    type: npm-registry
    url: https://npm.madfam.io
updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - npm-madfam
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the runtime, Node 22 LTS (.nvmrc, the Dockerfile base); it moves with the runtime only.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The MADFAM fleet stays on TypeScript 5.9; a major moves fleet-wide, never one repository first.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    ignore:
      # The runtime stays on Node 22 LTS; digest and minor bumps of node:22-alpine still arrive.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    groups:
      actions:
        patterns: ["*"]
