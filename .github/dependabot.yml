# Dependency updates: weekly, grouped, Monday morning in Mexico City, for the Dockerfile base image digest and the
# pinned actions.
version: 2
# No npm job, by owner ruling (2026-11-22, «Keep npm updates off»; MADFAM's private decision record). Dependabot's
# update jobs reach only hosts on its egress allowlist, so an npm job cannot fetch @pliego/engine from npm.madfam.io
# (403 from Dependabot's own proxy) without that registry declared, and a declaration needs a credential: an
# `npm-registry` entry without `token` (or username/password) does not match Dependabot's schema, and an invalid file
# stops every ecosystem here (2026-11-16 → 2026-11-21). npm advisories still show as Dependabot alerts (they come from
# the dependency graph, not from this file); npm versions move by hand in pull requests.
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    ignore:
      # The runtime stays on Node 22 LTS; digest and minor bumps of node:22-alpine still arrive. A bump that moves Node
      # fails image.yml until .nvmrc names the new version (CI's setup-node reads .nvmrc).
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    groups:
      actions:
        patterns: ["*"]
