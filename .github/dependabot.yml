# Dependency updates: weekly, grouped, Monday morning in Mexico City. Security updates are not grouped away:
# GitHub opens them as soon as an advisory lands. Ecosystems: npm (the pnpm workspace's one root lockfile),
# the Dockerfile base image digest, and the pinned actions.
version: 2
# No `registries:` block. Dependabot's update jobs reach only hosts on its egress allowlist, so the npm job cannot
# fetch @pliego/engine from npm.madfam.io (403 from Dependabot's own proxy) and fails until that registry is declared.
# A declaration needs a credential: an `npm-registry` entry without `token` (or username/password) does not match
# Dependabot's schema, and an invalid file stops every ecosystem below, not just npm (2026-11-16 → 2026-11-21).
# Declaring it with a credential (an org-level private registry, or a Dependabot secret through the intake) is an
# owner decision; until then the docker and github-actions jobs run and the npm job fails on that one package.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the runtime, Node 22 LTS (.nvmrc, the Dockerfile base); it moves with the runtime only.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The MADFAM fleet stays on TypeScript 5.9; a major moves fleet-wide, never one repository first.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    ignore:
      # The runtime stays on Node 22 LTS; digest and minor bumps of node:22-alpine still arrive. A bump that moves Node
      # fails image.yml until .nvmrc names the new version (CI's setup-node reads .nvmrc).
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    groups:
      actions:
        patterns: ["*"]
