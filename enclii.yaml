# Enclii manifest: cv (MADFAM CV, working label; onboarded and live; autoDeploy false, builds are dispatched).
#
# Decided topology (owner-named hosts, 2026-10-22; the Pliego multi-host pattern): ONE project and ONE service,
# both `cv` (namespace `cv`). One container serves all four hosts, routed by the Host header
# (apps/web/src/lib/routing.ts):
#   cv.madfam.io      landing (es-MX default, en); noindex until the brand is ruled (CV_INDEXABLE)
#   cv-app.madfam.io  the app (Janua sign-in; invite-only private beta, gated in Janua); never indexed
#   cv-api.madfam.io  API (/health, /ready, /api/v1/...); never indexed
#   cv-p.madfam.io    the pages people publish (/<slug>, /l/<token>; CV_HOST_PAGES); indexed only per page, by choice
# Flat labels only (never api.cv.madfam.io). A later split adds services without changing hosts.
#
# Tunnel routes: Enclii derives each domain's route from the Service document that declares it, on the
# domain's `port:`; the Kubernetes Service publishes 80 and the container listens on 3000, so every domain
# pins `port: 80`. metadata.name IS the Kubernetes Service name.
#
# Janua sign-in (Auth.js) and owner-scoped data (Postgres via PgBouncer) are configured in production; the code keeps
# each one off wherever its settings are missing (docs/DEPLOYMENT.md). Secrets are referenced by NAME only and reach
# the store only through Enclii's OIDC provisioner and `enclii secrets intake` (AUTH_*, HCM_*) or onboarding
# (`cv-secrets`: DATABASE_URL, APP_DATABASE_URL). Never `enclii secrets set`.
apiVersion: enclii.dev/v1
kind: Project
metadata:
  name: cv
spec:
  promotion:
    pattern: manual
    min_soak_minutes: 15
    require_smoke_pass: true
---
apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: cv
  project: cv
  description: MADFAM CV (working label); landing, app, API and published pages from one container, routed by Host
spec:
  domains:
    - name: cv.madfam.io
      environment: production
      port: 80
    - name: cv-app.madfam.io
      environment: production
      port: 80
    - name: cv-api.madfam.io
      environment: production
      port: 80
    # W6-A: the pages host (people's published CVs and portfolios), owner-approved name; CV_HOST_PAGES in deployment.yaml.
    - name: cv-p.madfam.io
      environment: production
      port: 80

  status:
    enabled: true
    entries:
      - name: cv
        url: https://cv.madfam.io/health
        href: https://cv.madfam.io
        group: cv
        family: MADFAM Platform
        description: Landing (invite-only private beta; noindex until the brand is ruled)
        assertContains: '"status":"ok"'
        assertNotContains: "localhost:"
      - name: cv app
        url: https://cv-app.madfam.io/health
        href: https://cv-app.madfam.io
        group: cv
        family: MADFAM Platform
        description: App (Janua sign-in; invite-only private beta)
        assertContains: '"status":"ok"'
        assertNotContains: "localhost:"
      - name: cv API
        url: https://cv-api.madfam.io/ready
        href: https://cv-api.madfam.io/api/v1/meta
        group: cv
        family: MADFAM Platform
        description: API (readiness; checks Postgres)
        assertContains: '"status":"ok"'
        assertNotContains: "localhost:"
      - name: cv pages
        url: https://cv-p.madfam.io/health
        href: https://cv-p.madfam.io
        group: cv
        family: MADFAM Platform
        description: Published pages (the CVs and portfolios people choose to publish; rate limited reads)
        assertContains: '"status":"ok"'
        assertNotContains: "localhost:"

  build:
    type: dockerfile
    dockerfile: Dockerfile
    context: .
    source:
      git:
        repository: https://github.com/madfam-org/ai-portfolio-builder
        branch: main
        autoDeploy: false

  runtime:
    port: 3000
    replicas: 2
    resources:
      requests:
        cpu: "50m"
        memory: "160Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    healthCheck: /health
    healthCheckTimeoutSeconds: 3

  slo:
    availability: 99.5
    latencyP99Ms: 2000

  # Tunnel ingress on the app port (3000) only. Egress (W2): DNS, HTTPS (Janua discovery/JWKS/token/logout) and
  # PgBouncer in `data` (6432). Declared here AND in infra/k8s/production/network-policy.yaml, before any
  # `enclii onboard ensure` renders policies from this file (the 2026-10-21 MAP outage).
  # The pod's internal metrics listener (9090, GET /metrics only) is NOT declared here: the generator has no
  # monitoring ingress type (a custom ingress rule selects pods in this namespace or everything), so the
  # monitoring-only admission is the repo-managed allow-monitoring-ingress in infra/k8s/production/network-policy.yaml,
  # which ensure never prunes. `port` stays the app port: the tunnel reaches 3000 only.
  network:
    services:
      - name: cv
        label: app.kubernetes.io/name
        port: 3000
        ingress: [cloudflare-tunnel]
        # W5-H: https also carries the call to Symbiosis HCM's public host (hcm-api.madfam.io), like Janua's.
        egress: [dns, https, pgbouncer]

  dependencies:
    - platform: enclii
      reason: deploy, the four domains, tunnel routes, status, secrets intake and the OIDC provisioner
    - platform: janua
      reason: identity (the cv-app client signs people in, invite-only through the cv entitlement; the API verifies RS256 tokens of audience cv-api issued to cv-app); janua.client.yaml holds the names
    - platform: symbiosis-hcm
      reason: the job page's market income range (INEGI ENOE aggregates; client credentials, scope hcm-benchmarks:read; only the job title and state leave cv)
