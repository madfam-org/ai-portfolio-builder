# W5-H: the Symbiosis HCM machine client for the job page's market range, by NAME only, from the platform's secret
# store (Vault `secret/cv`): hcm_client_id and hcm_client_secret, written by
# `enclii secrets provision oidc --platform cv-hcm-benchmarks` (intake target cv/hcm-client; Janua client_credentials,
# audience symbiosis-hcm, scope hcm-benchmarks:read). No human types either value. The intake lowercases keys, so
# the remote properties are lowercase, byte for byte.
#
# Its OWN Secret, never cv-web-auth: ESO is all-or-nothing per ExternalSecret, and sign-in must never wait on, or be
# broken by, this optional pair. The Deployment reads it with `optional: true`, so the pods start (and the benchmark
# stays dormant, 503 not_configured) until the pair exists. Sync-wave -1, like cv-web-auth.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cv-hcm-client
  labels:
    app.kubernetes.io/name: cv
    app.kubernetes.io/component: hcm-client
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: madfam-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: cv-hcm-client
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: HCM_CLIENT_ID
      remoteRef:
        key: secret/cv
        property: hcm_client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HCM_CLIENT_SECRET
      remoteRef:
        key: secret/cv
        property: hcm_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
