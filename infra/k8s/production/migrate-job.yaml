# Schema migration, run to completion before every sync (Argo PreSync hook). The SAME image as the app, in
# migration mode: CV_MIGRATE_AND_EXIT=true makes the server entry apply apps/web/drizzle as the database OWNER
# (DATABASE_URL from the onboarding Secret cv-secrets) and exit 0, or exit 1 with the reason (no URL or values are
# printed). The runtime pods never receive the owner URL: they read APP_DATABASE_URL (role cv_app) only.
#
# Network: the pod is labelled app.kubernetes.io/name=cv-migrate, so the Service `cv` (selector name=cv) never
# routes traffic to it, and NetworkPolicy allow-migrate-egress (network-policy-migrate.yaml) gives it DNS +
# PgBouncer only. Verify applied migrations in drizzle.__drizzle_migrations, never only the Job status.
# The image reference is the same decoy the kustomization pins to the built digest.
apiVersion: batch/v1
kind: Job
metadata:
  name: cv-migrate
  labels:
    app.kubernetes.io/name: cv-migrate
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: madfam-platform
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cv-migrate
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: madfam-platform
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: migrate
          image: ghcr.io/madfam-org/cv:latest
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          env:
            - name: NODE_ENV
              value: production
            - name: CV_MIGRATE_AND_EXIT
              value: "true"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 127.0.0.1
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: cv-secrets, key: DATABASE_URL }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { cpu: 500m, memory: 384Mi }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 32Mi
