# Reading images: the tlacuilo machine client, by NAME only, from the platform's secret store (`secret/cv`):
# tlacuilo_client_id and tlacuilo_client_secret, written by `enclii secrets provision oidc --platform cv-tlacuilo`
# (intake target cv/tlacuilo-client; Janua client_credentials, audience tlacuilo, scope tlacuilo:extract). No human
# types either value. The intake lowercases keys, so the remote properties are lowercase, byte for byte.
#
# Its OWN Secret, never cv-web-auth or cv-hcm-client: ESO is all-or-nothing per ExternalSecret, and neither sign-in
# nor the market range may wait on this optional pair. The Deployment reads it with `optional: true`, so the pods
# start (and reading images stays off) until the pair exists. Sync-wave -1, like the other two.
#
# MERGE ONLY AFTER THE CLIENT EXISTS: an ExternalSecret whose keys are absent leaves the app Degraded.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cv-tlacuilo-client
  labels:
    app.kubernetes.io/name: cv
    app.kubernetes.io/component: tlacuilo-client
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: madfam-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: cv-tlacuilo-client
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TLACUILO_CLIENT_ID
      remoteRef:
        key: secret/cv
        property: tlacuilo_client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: TLACUILO_CLIENT_SECRET
      remoteRef:
        key: secret/cv
        property: tlacuilo_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
