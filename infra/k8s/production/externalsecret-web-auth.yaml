# Sign-in secrets for cv-app, by NAME only, from the platform's secret store (Vault `secret/cv`):
#   - auth_janua_client_id, auth_janua_client_secret: written by `enclii secrets provision oidc --platform cv-app`
#     (intake target cv/web-oidc);
#   - auth_secret: generated inside the store by `enclii secrets intake submit cv/web-session --generate auth_secret`;
#     it encrypts cv's own session cookie and is never the Janua client secret (R42).
# The intake lowercases keys, so the remote properties are lowercase, byte for byte.
#
# A dedicated Secret owned by this ExternalSecret: cv-secrets is written by onboarding and is not managed here
# (an owning ExternalSecret over an existing Secret would delete every key it does not produce). ESO is
# all-or-nothing: the Secret exists only once all three properties exist (they do since 2026-10-22).
# Sync-wave -1: applied before the wave-0 Deployment (voxa k8s/production/voxa-web-session-externalsecret.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cv-web-auth
  labels:
    app.kubernetes.io/name: cv
    app.kubernetes.io/component: web-auth
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: madfam-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: cv-web-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AUTH_JANUA_CLIENT_ID
      remoteRef:
        key: secret/cv
        property: auth_janua_client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AUTH_JANUA_CLIENT_SECRET
      remoteRef:
        key: secret/cv
        property: auth_janua_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AUTH_SECRET
      remoteRef:
        key: secret/cv
        property: auth_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
