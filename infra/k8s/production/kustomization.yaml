apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The namespace is created by the platform at onboarding (with its platform labels); this base never declares a
# Namespace object or an Ingress. The three public hosts are tunnel routes Enclii writes from enclii.yaml
# (cv.madfam.io, cv-app.madfam.io, cv-api.madfam.io -> Service cv:80), and the tunnel peer is admitted to the
# app port (3000) only (network-policy.yaml). W2 data reads the onboarding Secret cv-secrets (database URLs,
# written by `enclii onboard ensure --generate-db-password --app-role cv_app`); the migrate PreSync Job applies the
# schema. Sign-in's ExternalSecret cv-web-auth lands separately, once Vault secret/cv holds its values.
namespace: cv

resources:
- deployment.yaml
- poddisruptionbudget.yaml
- service.yaml
- network-policy.yaml
- network-policy-migrate.yaml
- migrate-job.yaml

# Image digest: pinned by the Build & Deploy workflow (Enclii's reusable build-publish runs
# `kustomize edit set image <image>=<image>@sha256:...`, commits the pin to main, and the GitOps sync rolls it).
# The all-zero digest is a PLACEHOLDER the first successful build overwrites; it never resolves, so nothing can
# run unpinned before a real pin lands. The workload names the image with a `:latest` decoy that this block
# rewrites to the digest (the rendered manifest carries no tag at all).
images:
- digest: sha256:100a9dd52bb40a6cde849cb69e5e4be2d9bb9a5d132e9f189c0bb83bb93d20ba
  name: ghcr.io/madfam-org/cv
  newName: ghcr.io/madfam-org/cv
