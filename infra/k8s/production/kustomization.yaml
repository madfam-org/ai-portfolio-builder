apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The namespace is created by the platform at onboarding (with its platform labels); this base never declares a
# Namespace object or an Ingress. The four public hosts are tunnel routes Enclii writes from enclii.yaml
# (cv.madfam.io, cv-app.madfam.io, cv-api.madfam.io, cv-p.madfam.io -> Service cv:80), and the tunnel peer is
# admitted to the app port (3000) only (network-policy.yaml). W2 data reads the onboarding Secret cv-secrets (database
# URLs, written by `enclii onboard ensure --generate-db-password --app-role cv_app`); the migrate PreSync Job applies
# the schema. Sign-in reads the ExternalSecret cv-web-auth (the Janua client id and secret, AUTH_SECRET).
namespace: cv

# Sign-in (2026-10-22): the store holds the three values cv-web-auth reads (written through the Enclii OIDC
# provisioner and secret intake; see externalsecret-web-auth.yaml). ESO is all-or-nothing.
# W5-H: the Symbiosis HCM machine client (written by `enclii secrets provision oidc --platform cv-hcm-benchmarks`;
# see externalsecret-hcm-client.yaml); read with optional: true by the Deployment.
resources:
- deployment.yaml
- poddisruptionbudget.yaml
- service.yaml
- network-policy.yaml
- network-policy-migrate.yaml
- migrate-job.yaml
- externalsecret-web-auth.yaml
- externalsecret-hcm-client.yaml

# Image digest: pinned by the Build & Deploy workflow (Enclii's reusable build-publish runs
# `kustomize edit set image <image>=<image>@sha256:...`, commits the pin to main, and the GitOps sync rolls it).
# The digest below is the last pin Build & Deploy committed (before the first build it was an all-zero placeholder
# that never resolves, so nothing ran unpinned). The workload names the image with a `:latest` decoy that this block
# rewrites to the digest (the rendered manifest carries no tag at all).
images:
- digest: sha256:7deeefd1bcc19213c2c65dd6552e7eebbbd4baba888d5c590bceedb4009f8c89
  name: ghcr.io/madfam-org/cv
  newName: ghcr.io/madfam-org/cv
