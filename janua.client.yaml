# Janua registrations for cv (MADFAM CV, working label). NAMES ONLY: no client ids or secrets live here. Ids and
# secrets are created by Enclii's OIDC provisioner and land in the secret store, from which the pod's Secret is
# written through the intake (the next wave lists the key names in docs/DEPLOYMENT.md).
#
# NOT USED YET. Wave 1 (this tree) deploys without any Janua registration; these are prepared for the next wave
# (sign-in on cv-app, owner-scoped data). Janua matches redirect URIs exactly: no wildcards, no trailing-slash
# variants. The callback path is the Auth.js Janua provider's (/api/auth/callback/janua), so /api/auth/* on
# cv-app.madfam.io is left unclaimed in wave 1.
#
# Two registrations:
#   1. the API as a resource server (audience cv-api): it validates Janua RS256 tokens and mints none;
#   2. the app as a confidential client (cv-web): the same container signs people in on cv-app.madfam.io
#      (authorization code with PKCE) and calls the API with their access tokens.

resource_server: cv-api
client_type: resource_server
audiences:
  - cv-api
scopes:
  - name: cv:read
    description: Read the signed-in person's own portfolios, drafts included. Never another person's.
  - name: cv:write
    description: Create, edit, publish and delete the signed-in person's own portfolios. Implies cv:read.
token_endpoint: https://auth.madfam.io/api/v1/oauth/token
jwks_uri: https://auth.madfam.io/.well-known/jwks.json
issuer: https://auth.madfam.io

clients:
  - name: cv-web
    type: confidential
    grant_types:
      - authorization_code
      - refresh_token
    pkce: S256
    redirect_uris:
      - https://cv-app.madfam.io/api/auth/callback/janua
    post_logout_redirect_uris:
      - https://cv-app.madfam.io/
    sign_in_scopes:
      - openid
      - email
      - profile
      - offline_access
    audience: cv-api
    api_scopes:
      - cv:read
      - cv:write
    secrets_delivered_to:
      target: cv/web-oidc
      properties:
        - auth_janua_client_id
        - auth_janua_client_secret

notes: |
  Validation (API): RS256 signature against the JWKS, iss == issuer, aud == cv-api, and the route's required
  scope. HS256 is refused. Missing or invalid token -> 401; wrong audience or missing scope -> 403. Every
  portfolio row carries the owner's Janua `sub` and every query is owner-scoped; cross-tenant access tests land
  before sign-in is exposed (audit sequencing trap). The landing is anonymous. Account switching and
  RP-initiated logout are supported from day one (post_logout_redirect_uris).
