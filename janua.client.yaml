# Janua registrations for cv (MADFAM CV, working label). NAMES ONLY: no client ids or secrets live here. Ids and
# secrets are created by Enclii's OIDC provisioner and land in the secret store, from which the pod's Secret is
# written by the ExternalSecret cv-web-auth (key names: docs/DEPLOYMENT.md "Env contract").
#
# LIVE: the client is provisioned as `cv-app` (enclii#838; `enclii secrets provision oidc --platform cv-app`) and
# signs people in on cv-app.madfam.io. The beta is invite-only: Janua admits a person to this client only while they
# hold the `cv` product entitlement (docs/DEPLOYMENT.md "Beta access"). Janua matches redirect URIs exactly: no
# wildcards, no trailing-slash variants. The callback path is the Auth.js Janua provider's (/api/auth/callback/janua),
# served on cv-app.madfam.io only.
#
# Two registrations:
#   1. the API as a resource server (audience cv-api): it validates Janua RS256 tokens and mints none;
#   2. the app as a confidential client (cv-app): the same container signs people in on cv-app.madfam.io
#      (authorization code with PKCE) and calls the API with their access tokens.

resource_server: cv-api
client_type: resource_server
audiences:
  - cv-api
scopes:
  - name: cv:read
    description: Read the signed-in person's own portfolios, drafts included. Never another person's.
  - name: cv:write
    description: Create, edit, publish and delete the signed-in person's own portfolios. Implies cv:read.
token_endpoint: https://auth.madfam.io/api/v1/oauth/token
jwks_uri: https://auth.madfam.io/.well-known/jwks.json
issuer: https://auth.madfam.io

clients:
  - name: cv-app
    type: confidential
    grant_types:
      - authorization_code
      - refresh_token
    pkce: S256
    redirect_uris:
      - https://cv-app.madfam.io/api/auth/callback/janua
    post_logout_redirect_uris:
      - https://cv-app.madfam.io/
    sign_in_scopes:
      - openid
      - email
      - profile
      - offline_access
    audience: cv-api
    # Declared for a future split of the API from the app; the app requests only sign_in_scopes (see notes).
    api_scopes:
      - cv:read
      - cv:write
    secrets_delivered_to:
      target: cv/web-oidc
      properties:
        - auth_janua_client_id
        - auth_janua_client_secret

notes: |
  Validation (API, apps/web/src/server/janua.ts): RS256 signature against the JWKS, iss == issuer, aud == cv-api,
  and the token was issued to an accepted client (its client_id, or azp, in CV_JANUA_CLIENT_IDS, default the app's
  AUTH_JANUA_CLIENT_ID, i.e. cv-app). HS256 is refused. Missing or invalid token -> 401; wrong audience or another client ->
  403. The app signs in with openid email profile offline_access only, so its tokens carry no cv:read / cv:write
  and no route checks them; the scopes above stay declared for a future split of the API from the app. Every
  portfolio row carries the owner's Janua `sub` and every query is owner-scoped; the cross-tenant access tests
  (apps/web/test-pg/) landed before sign-in was exposed (audit sequencing trap). The landing is anonymous. Account switching and
  RP-initiated logout are supported from day one (post_logout_redirect_uris).
